<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enterprise technical documentation portal." />
    <meta name="theme-color" content="#F7F7F5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Inter for UI and prose, JetBrains Mono for code. Preconnect first so the
         font request starts before the CSS is parsed; swap avoids invisible text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <title>Documentation Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
